
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | Verdant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="confirmation.css">
</head>
<body>

    <main class="confirmation-container">

        <div class="success-icon">✓</div>

        <h1>Thank You for Your Order!</h1>

        <p class="confirmation-message">
            Your order has been placed successfully.
            We're getting your groceries ready.
        </p>

        <div class="order-details">
            <h2>Order Details</h2>

            <p>Order Number: <strong id="order-number"></strong></p>
            <p>Customer Name: <strong id="customer-name"></strong></p>
            <p>Delivery Address: <strong id="delivery-address"></strong></p>
            <p>Order Total: <strong id="order-total"></strong></p>
        </div>

        <div id="confirmed-items"></div>

        <a href="../shop.html" class="continue-shopping">
            Continue Shopping
        </a>

    </main>

    <script src="confirmation.js"></script>
</body>
</html>
